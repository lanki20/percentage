<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分率對對碰</title>
  
  <!-- 引入 Tailwind CSS 框架 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 來在瀏覽器編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-3deg); }
      50% { transform: translateX(5px) rotate(3deg); }
      75% { transform: translateX(-5px) rotate(-3deg); }
    }
    .animate-shake { animation: shake 0.5s ease-in-out; }
  </style>
</head>
<body class="bg-green-50 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG 圖示元件
    const IconAward = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
      </svg>
    );
    const IconTrophy = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    );
    const IconClock = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    );
    const IconXCircle = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    );
    const IconRefresh = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
      </svg>
    );

    // 完整的題庫資料
    const RAW_DATA = [
      { id: 1, values: ['1/25', '4%', '0.04', '96% off'] },
      { id: 2, values: ['1/20', '5%', '0.05', '95% off'] },
      { id: 3, values: ['1/10', '10%', '0.1', '1折', '90% off'] },
      { id: 4, values: ['3/20', '15%', '0.15', '15折', '85% off'] },
      { id: 5, values: ['1/5', '20%', '0.2', '2折', '80% off'] },
      { id: 6, values: ['1/4', '25%', '0.25', '25折', '75% off'] },
      { id: 7, values: ['3/10', '30%', '0.3', '3折', '70% off'] },
      { id: 8, values: ['7/20', '35%', '0.35', '35折', '65% off'] },
      { id: 9, values: ['2/5', '40%', '0.4', '4折', '60% off'] },
      { id: 10, values: ['9/20', '45%', '0.45', '45折', '55% off'] },
      { id: 11, values: ['1/2', '50%', '0.5', '5折', '50% off'] },
      { id: 12, values: ['11/20', '55%', '0.55', '55折', '45% off'] },
      { id: 13, values: ['3/5', '60%', '0.6', '6折', '40% off'] },
      { id: 14, values: ['13/20', '65%', '0.65', '65折', '35% off'] },
      { id: 15, values: ['7/10', '70%', '0.7', '7折', '30% off'] },
      { id: 16, values: ['3/4', '75%', '0.75', '75折', '25% off'] },
      { id: 17, values: ['4/5', '80%', '0.8', '8折', '20% off'] },
      { id: 18, values: ['17/20', '85%', '0.85', '85折', '15% off'] },
      { id: 19, values: ['9/10', '90%', '0.9', '9折', '10% off'] },
      { id: 20, values: ['19/20', '95%', '0.95', '95折', '5% off'] }
    ];

    // 工具函數：隨機打亂陣列
    const shuffleArray = (array) => {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    };

    function App() {
      const [cards, setCards] = useState([]);
      const [selectedIndices, setSelectedIndices] = useState([]);
      const [matchedIds, setMatchedIds] = useState([]);
      const [isChecking, setIsChecking] = useState(false);
      const [mistakes, setMistakes] = useState(0);
      const [timer, setTimer] = useState(0);
      const [gameState, setGameState] = useState('idle'); // idle, playing, won
      const [result, setResult] = useState(null);

      // 初始化遊戲
      const initializeGame = () => {
        // 1. 隨機選 8 題
        const shuffledData = shuffleArray(RAW_DATA);
        const selected8 = shuffledData.slice(0, 8);

        // 2. 針對每題，隨機挑選 2 種表達方式
        let initialCards = [];
        selected8.forEach((item) => {
          const shuffledValues = shuffleArray(item.values);
          const pickedValues = shuffledValues.slice(0, 2);
          
          initialCards.push({ uid: Math.random(), matchId: item.id, value: pickedValues[0] });
          initialCards.push({ uid: Math.random(), matchId: item.id, value: pickedValues[1] });
        });

        // 3. 打亂這 16 張卡片
        initialCards = shuffleArray(initialCards);

        setCards(initialCards);
        setSelectedIndices([]);
        setMatchedIds([]);
        setMistakes(0);
        setTimer(0);
        setGameState('playing');
        setResult(null);
      };

      // 處理計時器
      useEffect(() => {
        let interval;
        if (gameState === 'playing') {
          interval = setInterval(() => {
            setTimer((prev) => prev + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [gameState]);

      // 檢查遊戲是否勝利
      useEffect(() => {
        if (gameState === 'playing' && matchedIds.length === 8) {
          handleWin();
        }
      }, [matchedIds, gameState]);

      // 計算分數與等級
      const calculateScoreAndLevel = (time, mist) => {
        let score = 1000 - (time * 3) - (mist * 30);
        if (score < 0) score = 0;

        let level = 1;
        if (score >= 900) level = 10;
        else if (score >= 800) level = 9;
        else if (score >= 700) level = 8;
        else if (score >= 600) level = 7;
        else if (score >= 500) level = 6;
        else if (score >= 400) level = 5;
        else if (score >= 300) level = 4;
        else if (score >= 200) level = 3;
        else if (score >= 100) level = 2;

        const levelTitles = {
          10: "👑 數學宗師 (SSS)",
          9: "💎 傳奇大師 (SS)",
          8: "🌟 數學達人 (S)",
          7: "🏆 運算高手 (A+)",
          6: "🏅 熟練好手 (A)",
          5: "🚀 漸入佳境 (B+)",
          4: "📚 基礎扎實 (B)",
          3: "💪 再接再厲 (C)",
          2: "🌱 仍需努力 (D)",
          1: "🐣 新手入門 (E)"
        };

        return { score, level, title: levelTitles[level] };
      };

      const handleWin = () => {
        setGameState('won');
        setResult(calculateScoreAndLevel(timer, mistakes));
      };

      // 點擊卡片處理
      const handleCardClick = (index) => {
        if (isChecking || matchedIds.includes(cards[index].matchId)) {
          return;
        }

        // 再次點擊第一張卡片可取消選取
        if (selectedIndices.includes(index)) {
          setSelectedIndices([]);
          return;
        }

        const newSelected = [...selectedIndices, index];
        setSelectedIndices(newSelected);

        if (newSelected.length === 2) {
          setIsChecking(true);
          const card1 = cards[newSelected[0]];
          const card2 = cards[newSelected[1]];

          if (card1.matchId === card2.matchId) {
            setMatchedIds((prev) => [...prev, card1.matchId]);
            setSelectedIndices([]);
            setIsChecking(false);
          } else {
            setMistakes((prev) => prev + 1);
            setTimeout(() => {
              setSelectedIndices([]);
              setIsChecking(false);
            }, 800);
          }
        }
      };

      const renderCardValue = (val) => {
        if (val.includes('/') && !val.includes('off')) {
          const [num, den] = val.split('/');
          return (
            <div className="inline-flex flex-col items-center align-middle font-serif text-xl sm:text-2xl">
              <span className="border-b-[2px] border-current px-1 leading-none pb-[2px]">{num}</span>
              <span className="px-1 leading-none pt-[3px]">{den}</span>
            </div>
          );
        }
        return <span className="text-xl sm:text-2xl font-bold">{val}</span>;
      };

      return (
        <div className="flex flex-col items-center py-6 sm:py-10 px-4">
          <div className="text-center mb-6">
            <h1 className="text-3xl sm:text-4xl font-extrabold text-green-800 drop-shadow-sm tracking-wide flex items-center justify-center gap-3">
              <IconAward className="text-yellow-500 w-8 h-8 sm:w-10 sm:h-10" />
              百分率對對碰
              <IconAward className="text-yellow-500 w-8 h-8 sm:w-10 sm:h-10" />
            </h1>
            <p className="text-green-700 mt-2 font-medium text-sm sm:text-base">找出數值相等的卡片並將它們消除！</p>
          </div>

          {gameState === 'idle' ? (
            <button
              onClick={initializeGame}
              className="mt-10 px-8 py-4 bg-green-600 hover:bg-green-500 text-white rounded-full font-bold text-xl sm:text-2xl shadow-lg transition transform hover:scale-105 active:scale-95 flex items-center gap-3"
            >
              <IconTrophy className="w-6 h-6" />
              開始挑戰
            </button>
          ) : (
            <div className="w-full max-w-4xl flex flex-col items-center">
              <div className="w-full max-w-3xl flex justify-between bg-white px-6 py-3 rounded-2xl shadow-sm mb-6 border-2 border-green-100">
                <div className="flex items-center gap-2 text-gray-700 font-semibold text-lg">
                  <IconClock className="w-5 h-5 text-blue-500" />
                  <span>時間: {timer} 秒</span>
                </div>
                <div className="flex items-center gap-2 text-gray-700 font-semibold text-lg">
                  <IconXCircle className="w-5 h-5 text-red-500" />
                  <span>失誤: {mistakes} 次</span>
                </div>
              </div>

              <div className="grid grid-cols-4 gap-3 sm:gap-4 w-full max-w-3xl">
                {cards.map((card, index) => {
                  const isSelected = selectedIndices.includes(index);
                  const isMatched = matchedIds.includes(card.matchId);
                  
                  let cardClasses = "bg-white border-2 border-gray-200 text-gray-800 shadow-sm hover:shadow-md hover:border-green-300 transform transition-all duration-200 cursor-pointer active:scale-95";
                  
                  if (isMatched) {
                    cardClasses = "bg-green-100 border-2 border-green-400 text-green-700 opacity-50 pointer-events-none scale-95";
                  } else if (isSelected) {
                    if (selectedIndices.length === 2 && !matchedIds.includes(card.matchId)) {
                      cardClasses = "bg-red-50 border-2 border-red-500 text-red-600 animate-shake shadow-md";
                    } else {
                      cardClasses = "bg-blue-50 border-2 border-blue-500 text-blue-700 shadow-md scale-105";
                    }
                  }

                  return (
                    <div
                      key={card.uid}
                      onClick={() => handleCardClick(index)}
                      className={`aspect-[4/3] rounded-xl flex items-center justify-center p-2 select-none ${cardClasses}`}
                    >
                      {renderCardValue(card.value)}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {gameState === 'won' && result && (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 animate-in fade-in duration-300">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-100">
                <IconTrophy className="w-20 h-20 text-yellow-400 mx-auto mb-4 drop-shadow-md" />
                <h2 className="text-3xl font-bold text-gray-800 mb-2">挑戰完成！</h2>
                
                <div className="my-6 bg-green-50 rounded-2xl p-4 border border-green-100">
                  <p className="text-sm text-gray-500 font-medium mb-1">您的評價等級</p>
                  <p className="text-2xl font-extrabold text-green-700">Level {result.level}</p>
                  <p className="text-xl font-bold text-green-600 mt-1">{result.title}</p>
                </div>

                <div className="grid grid-cols-2 gap-4 mb-6 text-left">
                  <div className="bg-gray-50 rounded-xl p-3 border border-gray-100">
                    <p className="text-xs text-gray-500 font-medium">花費時間</p>
                    <p className="text-lg font-bold text-gray-800">{timer} 秒</p>
                  </div>
                  <div className="bg-gray-50 rounded-xl p-3 border border-gray-100">
                    <p className="text-xs text-gray-500 font-medium">失誤次數</p>
                    <p className="text-lg font-bold text-gray-800">{mistakes} 次</p>
                  </div>
                  <div className="col-span-2 bg-yellow-50 rounded-xl p-3 border border-yellow-100 text-center">
                    <p className="text-xs text-yellow-600 font-medium">最終得分 (滿分1000)</p>
                    <p className="text-2xl font-black text-yellow-500">{result.score}</p>
                  </div>
                </div>

                <button
                  onClick={initializeGame}
                  className="w-full py-4 bg-green-600 hover:bg-green-500 text-white rounded-xl font-bold text-lg shadow-md transition transform hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-2"
                >
                  <IconRefresh className="w-5 h-5" />
                  再來一局
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
